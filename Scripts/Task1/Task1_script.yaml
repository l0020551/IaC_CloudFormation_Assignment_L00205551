AWSTemplateFormatVersion: 2010-09-09
Description: IaC assignment 1 task 1 2026 

Parameters: ## using the same parameters as the latest cloudformations example
  LatestAmiId:
    Description: The latest Amazon Linux 2 AMI from the Parameter Store
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'

  InstanceType:
    Description: WebServer EC2 instance type
    Type: String
    Default: t2.micro
    AllowedValues:
      - t3.micro
      - t2.micro
    ConstraintDescription: must be a valid EC2 instance type.
    
  MyIP:
    Description: Your IP address in CIDR format (e.g. 203.0.113.1/32).
    Type: String
    MinLength: '9'
    MaxLength: '18'
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: must be a valid IP CIDR range of the form x.x.x.x/x, use 0.0.0.0/0 for web exposure, your own IP address to only expose page to your PC.
    
  IDbucketName: ### add reference to existing S3 rather than enerating one that must thenbe populated
    Description: S3 bucket containing html with student name and ID
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9\-]{1,61}[a-z0-9]$'  ## give params to stop none -s3 compatible values being added
    ConstraintDescription: The IDbucketName parameter must be a valid lowercase S3 bucket string (3-63 chars, lowercase, numbers, or hyphens only).

Resources:

  # Amazon Q suggestion IAM Role so EC2 can read from S3
  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: ReadWebsiteContent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource: !Sub "arn:aws:s3:::${IDbucketName}" ## update to use existing s3
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub "arn:aws:s3:::${IDbucketName}/*"
## end of amazon q suggestions 
  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebServerRole

  # Allow HTTP access to the EC2 instance
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access via my IP address
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref MyIP
        # - IpProtocol: tcp   ## added for debugging/ remove for production
        #   FromPort: 22
        #   ToPort: 22
        #   CidrIp: !Ref MyIP

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref WebServerInstanceProfile
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -uxo pipefail

          # Inject region context for AWS CLI stability in UserData
          export AWS_DEFAULT_REGION=${AWS::Region}

          yum update -y
          yum install -y httpd awscli
          mkdir -p /var/www/html

          # Retry loop - set +e so a failed attempt doesn't abort the script
          set +e
          DOWNLOADED=false
          for i in {1..6}; do
            if aws s3 cp s3://${IDbucketName}/s3_student_info.html /var/www/html/index.html; then
              DOWNLOADED=true
              break
            fi
            sleep 10
          done
          set -e

          # Exit with error if download never succeeded
          if [ "$DOWNLOADED" = false ]; then
            echo "ERROR: Failed to download HTML from S3 after 6 attempts" >&2
            # Optional: falling back to a placeholder so apache still turns on for grading debugging
            echo "<h1>S3 Download Failed - Check IAM/Network logs</h1>" > /var/www/html/index.html
          fi

          chmod 644 /var/www/html/index.html

          systemctl enable httpd
          systemctl start httpd

Outputs:
  WebsiteURL:
    Description: URL of the website
    Value: !Sub 'http://${WebServer.PublicDnsName}/'
