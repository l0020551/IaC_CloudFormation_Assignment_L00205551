AWSTemplateFormatVersion: 2010-09-09
Description: IaC assignment 1 task 1 2026 

Parameters: ## using the same parameters as the latest cloudformations example
  LatestAmiId:
    Description: The latest Amazon Linux 2 AMI from the Parameter Store
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'

  InstanceType:
    Description: WebServer EC2 instance type
    Type: String
    Default: t2.micro
    AllowedValues:
      - t3.micro
      - t2.micro
    ConstraintDescription: must be a valid EC2 instance type.
    
  MyIP:
    Description: Your IP address in CIDR format (e.g. 203.0.113.1/32).
    Type: String
    MinLength: '9'
    MaxLength: '18'
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: must be a valid IP CIDR range of the form x.x.x.x/x.

## As the task follows the majority of the tutorial regarding exposing to the web resources can remain the same.
## instead of echoing "Hello World!" we can simply cat the content of a file in a mounted S3 bucket. 

Resources:

  WebsiteContentBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: iac-assign1-task1-l00205551-2
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # Amazon Q suggestion IAM Role so EC2 can read from S3
  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref WebServerRole

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      

   
### end of Amazon Q recommendation

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP access via my IP address
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref MyIP

  WebServer:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      IamInstanceProfile: !Ref WebServerInstanceProfile  # <-- must be here
      # UserData: !Base64 |
      #   #!/bin/bash
      #   yum update -y
      #   yum install -y httpd
      #   systemctl start httpd
      #   systemctl enable httpd
      #   # Copy the HTML file from S3 directly to the web root
      #   aws s3 cp s3://${iac-assign1-task1-l00205551}/s3_student_info.html /var/www/html/index.html
      #   cat /mnt/s3_student_info.html
      UserData:
        Fn::Base64:
          !Sub |                          # <-- !Sub resolves ${WebsiteContentBucket}
            #!/bin/bash
            yum update -y
            yum install -y httpd
            systemctl start httpd
            systemctl enable httpd
            aws s3 cp s3://${WebsiteContentBucket}/s3_student_info.html /var/www/html/index.html



Outputs:
  WebsiteURL:
    Value: !Join
      - ''
      - - http://
        - !GetAtt WebServer.PublicDnsName
    Description: Website URL