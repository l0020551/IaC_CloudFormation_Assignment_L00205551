<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ATU Letterkenny Weather</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 0 20px;
      background: #f2f6fa;
      color: #182230;
    }
    .card {
      background: white;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 2px 10px #0001;
    }
    .temperature { font-size: 42px; font-weight: bold; }
    .muted { color: #657080; }
  </style>
</head>
<body>
  <h1>ATU Letterkenny Weather</h1>
  <div class="card">
    <p class="muted">Met Éireann forecast</p>
    <div id="temperature" class="temperature">Loading...</div>
    <p id="condition">Retrieving forecast...</p>
    <p>Forecast time: <span id="forecast-time">--</span></p>
    <p>Last updated: <span id="updated-time">--</span></p>
    <p id="status" class="muted">Connecting...</p>
  </div>

  <script>
    async function updateWeather() {
      const status = document.getElementById("status");

      try {
        const response = await fetch("/api/weather/latest", {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("API returned HTTP " + response.status);
        }

        const data = await response.json();

        document.getElementById("temperature").textContent =
          data.temperature_c == null
            ? "N/A"
            : Number(data.temperature_c).toFixed(1) + " °C";

        document.getElementById("condition").textContent =
          "Condition ID: " + (data.condition_id || "N/A");

        document.getElementById("forecast-time").textContent =
          data.forecast_time || "--";

        document.getElementById("updated-time").textContent =
          data.fetched_at || "--";

        status.textContent = "Connected · refreshed " +
          new Date().toLocaleTimeString();
      } catch (error) {
        status.textContent = "Unable to retrieve weather: " + error.message;
      }
    }

    updateWeather();
    setInterval(updateWeather, 30000);
  </script>
</body>
</html>
