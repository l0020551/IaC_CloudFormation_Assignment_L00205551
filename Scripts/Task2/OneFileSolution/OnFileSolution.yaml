# Merged from: 0_VPC.yaml -> 1_database.yaml -> 2_webNapp.yaml
# Dependencies deliberately serialize these three provisioning phases.
AWSTemplateFormatVersion: "2010-09-09"
Description: 'AI Combined three-tier CloudFormation stack, deployed in phases: VPC/network, PostgreSQL RDS, then web/application
  EC2 and CloudFront.'
Parameters:
  DeveloperIP:
    Type: String
    MinLength: '9'
    MaxLength: '18'
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: must be a valid IP CIDR range of the form x.x.x.x/x.
  WebSSHIP:
    Type: String
    MinLength: '9'
    MaxLength: '18'
    Default: 0.0.0.0/0
    AllowedPattern: '^(\d{1,3}\.){3}\d{1,3}\/\d{1,2}$'
    ConstraintDescription: must be a valid IP CIDR range of the form x.x.x.x/x.

  DBUsername:
    Type: String
    Default: dbadmin
    Description: 'The database admin master username'
  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 30
    AllowedPattern: '^(?=.*[A-Z])(?=.*[!@#$%^&*(),.?":{}|<>]).+$'
    ConstraintDescription: Password must contain at least one uppercase letter and one special character.
    Description: Password for Database

  YourIPAddress:
    Type: String
    Description: 'Your local public IP address to allow firewall access (Format: x.x.x.x/32)'
    AllowedPattern: '^([0-9]{1,3}\.){3}[0-9]{1,3}/32$'

  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    Description: Latest Amazon Linux 2023 AMI

  NginxPythonScriptName:
    Type: String
    Default: 'flaskWebpageUpdater.py'
    Description: 'The name of the python file inside the bucket for web tier of system'

  DBName:
    Type: String
    Default: postgres
    Description: 'PostgreSQL database name used by the web/app (postgres is the default database provided by RDS when no DBName
      is specified).'

  WebInstanceType:   ### app and web ec2 instances are parsed 
    Description: WebServer EC2 instance type
    Type: String
    Default: t2.micro
    AllowedValues:
    - t3.micro
    - t2.micro
    ConstraintDescription: Must be a valid EC2 instance type.

  AppInstanceType: ### app and web ec2 instances are parsed 
    Description: AppServer EC2 instance type
    Type: String
    Default: t2.micro
    AllowedValues:
    - t3.micro
    - t2.micro
    ConstraintDescription: Must be a valid EC2 instance type.

  IDbucketName:
    Description: Existing S3 bucket containing the application files
    Type: String
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    ConstraintDescription: Must be a valid lowercase S3 bucket name.

  DBPort:
    Type: String
    Default: 5432
    Description: 'Port for the existing RDS database (5432 for PostgreSQL, 3306 for MySQL)'


Resources:
  # VPC
  IaCAssigment2VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/24
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
      - Key: Name
        Value: IaC_Assigment2vpc

  # Internet gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
      - Key: Name
        Value: ATU_MetApp

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref IaCAssigment2VPC
      InternetGatewayId: !Ref InternetGateway

  # Public subnet for the web tier
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IaCAssigment2VPC
      CidrBlock: 10.0.0.0/28
      AvailabilityZone: eu-west-1a
      MapPublicIpOnLaunch: true
      Tags:
      - Key: Name
        Value: publicNet

  # Private application subnet
  PrivateAppSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IaCAssigment2VPC
      CidrBlock: 10.0.0.16/28
      AvailabilityZone: eu-west-1a
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value: PrivateAppNet

  # Private database subnet in AZ a
  PrivateRDSSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IaCAssigment2VPC
      CidrBlock: 10.0.0.32/28
      AvailabilityZone: eu-west-1a
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value: privateRDSnet

  # Private database/backup subnet in AZ b
  PrivateBackupSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref IaCAssigment2VPC
      CidrBlock: 10.0.0.48/28
      AvailabilityZone: eu-west-1b
      MapPublicIpOnLaunch: false
      Tags:
      - Key: Name
        Value: privateBackupNet

  # Optional, useful when adding an RDS DB instance later
  RDSDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for RDS across two availability zones
      SubnetIds:
      - !Ref PrivateRDSSubnet
      - !Ref PrivateBackupSubnet
      Tags:
      - Key: Name
        Value: ATU_Met_RDS_SubnetGroup

  # NAT gateway in public subnet
  NatEIP:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP.AllocationId
      SubnetId: !Ref PublicSubnet
      Tags:
      - Key: Name
        Value: IaC_Assigment2vpc-NAT

  # Public routes
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IaCAssigment2VPC
      Tags:
      - Key: Name
        Value: ATU_MET_Public

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # Private routes; preserves original NAT behavior for all private subnets
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref IaCAssigment2VPC
      Tags:
      - Key: Name
        Value: MetPrivateRouteTable

  PrivateRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateAppSubnetRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateAppSubnet
      RouteTableId: !Ref PrivateRouteTable

  PrivateRDSSubnetRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateRDSSubnet
      RouteTableId: !Ref PrivateRouteTable

  PrivateBackupSubnetRTAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateBackupSubnet
      RouteTableId: !Ref PrivateRouteTable

  # Web server SG: preserve original HTTP/egress rules
  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: WebServerSecurityGroup
      GroupDescription: Allow HTTP traffic to the web server
      VpcId: !Ref IaCAssigment2VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
      - IpProtocol: "-1"
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Name
        Value: WebServerSecurityGroup

  # Developer DB SG: does not itself make a private RDS instance internet-accessible
  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: DBSecurityGroup
      GroupDescription: Allow PostgreSQL traffic from developer CIDR
      VpcId: !Ref IaCAssigment2VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        CidrIp: !Ref DeveloperIP
      SecurityGroupEgress:
      - IpProtocol: "-1"
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Name
        Value: DBSecurityGroup

  # Web front SG: preserve original HTTP, SSH and HTTPS egress
  WebFrontSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: WebSG
      GroupDescription: WebFrontSecurityGroup
      VpcId: !Ref IaCAssigment2VPC
      SecurityGroupIngress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        CidrIp: !Ref WebSSHIP
      SecurityGroupEgress:  ## for debug access to SSM. Remove for deployment!!!
      - IpProtocol: tcp
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Name
        Value: WebSG

  # Define App SG without referring to the RDS SG
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: AppSG
      GroupDescription: SecurityGroupForApp
      VpcId: !Ref IaCAssigment2VPC
      SecurityGroupIngress:
        # Original SSH access from web front; remove if using SSM only
      - IpProtocol: tcp
        FromPort: 22
        ToPort: 22
        SourceSecurityGroupId: !Ref WebFrontSecurityGroup
      SecurityGroupEgress:
      - IpProtocol: tcp
        FromPort: 80
        ToPort: 80
        CidrIp: 0.0.0.0/0
      - IpProtocol: tcp   ## for debug access to SSM. Remove for deployment!!!
        FromPort: 443
        ToPort: 443
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Name
        Value: AppSG

  # Define RDS SG independently (no App SG ref in its inline rules)
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: ATU_Met_RDS
      GroupDescription: Security group for PostgreSQL database
      VpcId: !Ref IaCAssigment2VPC
      SecurityGroupEgress:
      - IpProtocol: "-1"
        CidrIp: 0.0.0.0/0
      Tags:
      - Key: Name
        Value: ATU_Met_RDS

  # Both SGs now exist; these standalone rules avoid a circular dependency
  AppToRDSEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref RDSSecurityGroup

  RDSFromAppIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref RDSSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AppSecurityGroup

  # PHASE 2/3 - DATABASE: starts only after ALL 25 VPC resources exist.
  # The existing RDSDBSubnetGroup is reused; no duplicate subnet group is required.
  DebugDBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DependsOn:
    - IaCAssigment2VPC
    - InternetGateway
    - VPCGatewayAttachment
    - PublicSubnet
    - PrivateAppSubnet
    - PrivateRDSSubnet
    - PrivateBackupSubnet
    - RDSDBSubnetGroup
    - NatEIP
    - NatGateway
    - PublicRouteTable
    - PublicRoute
    - PublicSubnetRouteTableAssociation
    - PrivateRouteTable
    - PrivateRoute
    - PrivateAppSubnetRTAssociation
    - PrivateRDSSubnetRTAssociation
    - PrivateBackupSubnetRTAssociation
    - WebServerSecurityGroup
    - DBSecurityGroup
    - WebFrontSecurityGroup
    - AppSecurityGroup
    - RDSSecurityGroup
    - AppToRDSEgress
    - RDSFromAppIngress
    Properties:
      GroupDescription: 'Allow SQL Console inbound traffic from Developer IP'
      VpcId: !Ref IaCAssigment2VPC
      SecurityGroupIngress: # Fixed from SecurityGroupInboundRules
      - IpProtocol: tcp
        FromPort: 5432
        ToPort: 5432
        CidrIp: !Ref YourIPAddress

  # 3. The PostgreSQL Instance leveraging the existing infrastructure
  DebugDatabase:
    Type: AWS::RDS::DBInstance
    Properties:
      DBInstanceIdentifier: met-rds
      Engine: postgres
      EngineVersion: '15'
      DBInstanceClass: db.t4g.micro
      AllocatedStorage: '20'
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      PubliclyAccessible: false  # Private RDS subnet group has no route to an internet gateway
      DBSubnetGroupName: !Ref RDSDBSubnetGroup
      VPCSecurityGroups:
      - !Ref RDSSecurityGroup        # Your selected baseline security group
      - !GetAtt DebugDBSecurityGroup.GroupId # The specific developer IP bypass group built above
      DeletionProtection: false

  # PHASE 3/3 - WEB & APP: every deployment path waits for DebugDatabase,
  # which in turn waits for completion of the entire VPC phase.
  EC2S3ReadRole:
    Type: AWS::IAM::Role
    DependsOn: DebugDatabase
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action:
          - sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore    # Add this block

      Policies:
      - PolicyName: S3BucketReadPolicy
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:GetObject
            - s3:ListBucket
            Resource:
            - !Sub 'arn:aws:s3:::${IDbucketName}'
            - !Sub 'arn:aws:s3:::${IDbucketName}/*'

  AppServerRole:
    Type: AWS::IAM::Role
    DependsOn: DebugDatabase
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service: ec2.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
      - PolicyName: ReadWebsiteContent
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - s3:ListBucket
            - s3:GetBucketLocation
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${IDbucketName}'
          - Effect: Allow
            Action:
            - s3:GetObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${IDbucketName}/*'

  AppServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - !Ref AppServerRole

  AppServer:
    Type: AWS::EC2::Instance
    DependsOn: DebugDatabase
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref AppInstanceType
      IamInstanceProfile: !Ref AppServerInstanceProfile
      SubnetId: !Ref PrivateAppSubnet
      SecurityGroupIds:
      - !Ref AppSecurityGroup
      Tags:
      - Key: Name
        Value: Tier2 App Server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -Eeuxo pipefail

          exec > >(tee -a /var/log/user-data.log) 2>&1
          trap 'rc=$?; echo "ERROR: line $LINENO, exit code $rc"' ERR

          export AWS_DEFAULT_REGION=${AWS::Region}

          echo "=== User data started: $(date -Is) ==="
          cat /etc/os-release

          yum update -y
          yum install -y httpd awscli python3 python3-pip

          # PostgreSQL 15 client for Amazon Linux 2023 (no amazon-linux-extras)
          dnf install -y postgresql15

          # Fixed syntax typo mapping variable assignments
          export DB_HOST="${DebugDatabase.Endpoint.Address}"
          export DB_USER="${DBUsername}"
          export DB_PASSWORD="${DBPassword}"
          export DB_NAME="${DBName}"
          export DB_PORT="${DBPort}"

          mkdir -p /var/app/opt

          DOWNLOADED=false
          for i in {1..6}; do
            if aws s3 cp "s3://${IDbucketName}/met_weather.py" /var/app/met_weather.py && \
               aws s3 cp "s3://${IDbucketName}/requirements.txt" /var/app/requirements.txt; then
              DOWNLOADED=true
              break
            fi
            echo "S3 download attempt $i failed; retrying..."
            sleep 10
          done

          if [ "$DOWNLOADED" != true ]; then
            echo "ERROR: Failed to download application files from S3."
            exit 1
          fi

          chmod 644 /var/app/met_weather.py /var/app/requirements.txt

          python3 -m venv /var/app/venv
          /var/app/venv/bin/python -m pip install -r /var/app/requirements.txt

          chown -R ec2-user:ec2-user /var/app

          # Run the app as a managed service
          cat > /etc/systemd/system/standalone-app.service <<'SERVICE'
          [Unit]
          Description=Standalone Forecast Application
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/var/app
          ExecStart=/var/app/venv/bin/python -u /var/app/met_weather.py
          Restart=on-failure
          RestartSec=5
          StandardOutput=append:/var/log/standalone-app.log
          StandardError=append:/var/log/standalone-app.log

          [Install]
          WantedBy=multi-user.target
          SERVICE

          systemctl daemon-reload
          systemctl enable --now standalone-app.service
          systemctl enable --now httpd

          echo "=== User data completed: $(date -Is) ==="


  # Web EC2 Instance to Host the Server & Proxy


  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
      - !Ref EC2S3ReadRole


  WeatherAppServer:
    Type: AWS::EC2::Instance
    DependsOn: DebugDatabase
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref WebInstanceType
      IamInstanceProfile: !Ref WebServerInstanceProfile
      NetworkInterfaces:
      - DeviceIndex: '0'
        AssociatePublicIpAddress: true
        SubnetId: !Ref PublicSubnet
        GroupSet:
        - !Ref WebServerSecurityGroup
      Tags:
      - Key: Name
        Value: Tier1 Web Server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # 1. Update system and install Python, GCC, and Nginx
          dnf update -y
          dnf install -y python3-pip python3-devel gcc nginx

          # 2. Install Flask and PyMySQL dependencies
          pip3 install flask pymysql

          # 3. Create the app directory and download the script from S3
          mkdir -p /opt/weather-app
          aws s3 cp s3://${IDbucketName}/${NginxPythonScriptName} /opt/weather-app/app.py

          # 4. Ensure the script binds to localhost (127.0.0.1) since Nginx handles public traffic
          sed -i "s/'0.0.0.0'/'127.0.0.1'/g" /opt/weather-app/app.py
          sed -i 's/"0.0.0.0"/"127.0.0.1"/g' /opt/weather-app/app.py

          # 5. Export configuration environment variables
          export DB_HOST="${DebugDatabase.Endpoint.Address}"
          export DB_USER="${DBUsername}"
          export DB_PASSWORD="${DBPassword}"
          export DB_NAME="${DBName}"
          export DB_PORT="${DBPort}"

          # 6. Configure Nginx as a Reverse Proxy to Port 5000
          cat << 'EOF' > /etc/nginx/conf.d/weather_app.conf
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          EOF

          # 7. Start and enable Nginx service
          systemctl start nginx
          systemctl enable nginx

          # 8. Execute Flask application in the background (Defaulting to port 5000)
          nohup python3 /opt/weather-app/app.py > /var/log/weather-app.log 2>&1 &

  # CloudFront Distribution Layer
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        Comment: 'Public Global CDN Cache layer for Weather App'
        Origins:
        - Id: CustomEC2Origin
          DomainName: !GetAtt WeatherAppServer.PublicDnsName
          CustomOriginConfig:
            HTTPPort: 80
            OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: CustomEC2Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
          - GET
          - HEAD
          - OPTIONS
          - PUT
          - POST
          - PATCH
          - DELETE
          CachedMethods:
          - GET
          - HEAD
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref IaCAssigment2VPC
    Export:
      Name: !Sub "${AWS::StackName}-VPCId"

  PublicSubnetId:
    Description: Public Web Subnet ID
    Value: !Ref PublicSubnet
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetId"

  PrivateAppSubnetId:
    Description: Private App Subnet ID
    Value: !Ref PrivateAppSubnet
    Export:
      Name: !Sub "${AWS::StackName}-PrivateAppSubnetId"

  PrivateRDSSubnetId:
    Description: Private RDS Subnet ID
    Value: !Ref PrivateRDSSubnet
    Export:
      Name: !Sub "${AWS::StackName}-PrivateRDSSubnetId"

  PrivateBackupSubnetId:
    Description: Private Backup Subnet ID
    Value: !Ref PrivateBackupSubnet
    Export:
      Name: !Sub "${AWS::StackName}-PrivateBackupSubnetId"

  RDSDBSubnetGroupName:
    Description: RDS DB Subnet Group name
    Value: !Ref RDSDBSubnetGroup

  WebServerSGId:
    Description: Web Server Security Group ID
    Value: !Ref WebServerSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-WebServerSGId"

  WebFrontSGId:
    Description: Web Front Security Group ID
    Value: !Ref WebFrontSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-WebFrontSGId"

  AppSGId:
    Description: App Security Group ID
    Value: !Ref AppSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AppSGId"

  RDSSGId:
    Description: RDS Security Group ID
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-RDSSGId"

  DBSGId:
    Description: DB Security Group ID
    Value: !Ref DBSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-DBSGId"
  DatabaseConnectionString:
    Description: 'The connection endpoint host for your SQL Console application'
    Value: !GetAtt DebugDatabase.Endpoint.Address
  PublicWebpageUrl:
    Description: CloudFront HTTPS URL for the web application
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'