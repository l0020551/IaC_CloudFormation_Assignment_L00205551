AWSTemplateFormatVersion: '2010-09-09'
Description: 'Deploys a Flask Weather Dashboard App on EC2 with an Nginx reverse proxy, behind CloudFront.'

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-6.1-x86_64
    Description: Latest Amazon Linux 2023 AMI

  ExistingVpcId:
    Type: AWS::EC2::VPC::Id
    Description: 'ID of your existing VPC'

  ExistingSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: 'ID of an existing public subnet inside that VPC'

  S3BucketName:
    Type: String
    Description: 'The name of the existing S3 bucket containing your python script (e.g., my-weather-bucket)'
    AllowedPattern: '^[a-z0-9][a-z0-9-]{1,61}[a-z0-9]$'
    ConstraintDescription: Must be a valid lowercase S3 bucket name.

  PythonScriptName:
    Type: String
    Default: 'app.py'
    Description: 'The name of the python file inside the bucket (e.g., app.py or dashboard.py)'

  DBHost:
    Type: String
    Description: 'The endpoint/hostname of your existing MySQL database'

  DBUser:
    Type: String
    Default: dbadmin
    Description: 'The database user name'

  DBName:
    Type: String
    Default: weather_db
    Description: 'The name of the database'

  WebPageSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: "Select a single security group for the Webpage EC2 instance."

  DBPassword:
    Type: String
    NoEcho: true
    Description: 'The password for your database user'

Resources:

  # 1. IAM Role allowing EC2 to read from your specific S3 Bucket
  EC2S3ReadRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore  # Add this block

      Policies:
        - PolicyName: S3BucketReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Sub 'arn:aws:s3:::${S3BucketName}'
                  - !Sub 'arn:aws:s3:::${S3BucketName}/*' 

  # 2. Instance Profile linking the IAM role to the EC2 Instance
  EC2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref EC2S3ReadRole

  # 3. EC2 Instance to Host the Server & Proxy
  WeatherAppServer:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      SubnetId: !Ref ExistingSubnetId
      SecurityGroupIds:
        - !Ref WebPageSecurityGroupId
      IamInstanceProfile: !Ref EC2InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          # 1. Update system and install Python, GCC, and Nginx
          dnf update -y
          dnf install -y python3-pip python3-devel gcc nginx

          # 2. Install Flask and PyMySQL dependencies
          pip3 install flask pymysql

          # 3. Create the app directory and download the script from S3
          mkdir -p /opt/weather-app
          aws s3 cp s3://${S3BucketName}/${PythonScriptName} /opt/weather-app/app.py

          # 4. Ensure the script binds to localhost (127.0.0.1) since Nginx handles public traffic
          sed -i "s/'0.0.0.0'/'127.0.0.1'/g" /opt/weather-app/app.py
          sed -i 's/"0.0.0.0"/"127.0.0.1"/g' /opt/weather-app/app.py

          # 5. Export configuration environment variables
          export DB_HOST="${DBHost}"
          export DB_USER="${DBUser}"
          export DB_PASSWORD="${DBPassword}"
          export DB_NAME="${DBName}"

          # 6. Configure Nginx as a Reverse Proxy to Port 5000
          cat << 'EOF' > /etc/nginx/conf.d/weather_app.conf
          server {
              listen 80;
              server_name _;

              location / {
                  proxy_pass http://127.0.0.1:5000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          EOF

          # 7. Start and enable Nginx service
          systemctl start nginx
          systemctl enable nginx

          # 8. Execute Flask application in the background (Defaulting to port 5000)
          nohup python3 /opt/weather-app/app.py > /var/log/weather-app.log 2>&1 &

  # 4. CloudFront Distribution Layer
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2
        Comment: 'Public Global CDN Cache layer for Weather App'
        Origins:
          - Id: CustomEC2Origin
            DomainName: !GetAtt WeatherAppServer.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginProtocolPolicy: http-only
        DefaultCacheBehavior:
          TargetOriginId: CustomEC2Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
          MinTTL: 0
          DefaultTTL: 0
          MaxTTL: 0

Outputs:
  PublicWebpageUrl:
    Description: 'The public URL provided by CloudFront to view your Live Weather Logs'
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
